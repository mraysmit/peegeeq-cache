openapi: 3.1.0
info:
  title: PeeGeeQ Cache Management API
  version: 1.0.0-draft
  description: Management API contract for PeeGeeQ Cache.
paths:
  /api/v1/session:
    get:
      x-security-profile: SESSION
      security:
        - trustedProxyIdentity: []
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getSession
  /api/v1/session/local:
    post:
      x-security-profile: LOCAL_BOOTSTRAP
      security: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: exchangeLocalToken
    delete:
      x-security-profile: VIEW_MUTATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: deleteLocalSession
  /api/v1/setups:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: listSetups
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: registerSetup
  /api/v1/setups/actions/test:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: testUnregisteredSetup
  /api/v1/setups/{setupId}:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getSetup
    delete:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: forgetSetup
  /api/v1/setups/{setupId}/connect:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: connectSetup
  /api/v1/setups/{setupId}/test:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: testRegisteredSetup
  /api/v1/setups/{setupId}/detach:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: detachSetup
  /api/v1/setups/{setupId}/health:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getSetupHealth
  /api/v1/setups/{setupId}/capabilities:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getSetupCapabilities
  /api/v1/setups/{setupId}/overview:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getOverview
  /api/v1/setups/{setupId}/namespaces:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: listNamespaces
  /api/v1/setups/{setupId}/namespaces/export:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: exportNamespaces
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getNamespace
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: listEntries
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/{encodedKey}:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getEntry
    put:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: setEntry
    delete:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: deleteEntry
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/{encodedKey}/value/reveal:
