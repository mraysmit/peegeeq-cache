        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: revealEntryValue
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/{encodedKey}/ttl:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: expireEntry
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/{encodedKey}/persist:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: persistEntry
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/{encodedKey}/touch:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: touchEntry
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/bulk-delete/preview:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: previewEntryBulkDelete
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/entries/bulk-delete/execute:
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: executeEntryBulkDelete
  /api/v1/setups/{setupId}/counters:
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: listCounters
  /api/v1/setups/{setupId}/namespaces/{encodedNamespace}/counters/{encodedKey}:
    get:
      x-security-profile: VIEW
