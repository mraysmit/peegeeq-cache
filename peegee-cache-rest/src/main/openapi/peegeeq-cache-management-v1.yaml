openapi: 3.1.0
info:
  title: PeeGeeQ Cache Management API
  version: 1.0.0-draft
  description: Management API contract for PeeGeeQ Cache.
paths:
  /api/v1/session:
    get:
      x-security-profile: SESSION
      security:
        - trustedProxyIdentity: []
        - managementSession: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentSessionNoStore'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getSession
  /api/v1/session/local:
    post:
      x-security-profile: LOCAL_BOOTSTRAP
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        $ref: '#/components/requestBodies/LocalTokenExchangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CurrentSessionNoStore'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: exchangeLocalToken
    delete:
      x-security-profile: VIEW_MUTATE
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          $ref: '#/components/responses/LocalSessionDeleted'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: deleteLocalSession
  /api/v1/setups:
