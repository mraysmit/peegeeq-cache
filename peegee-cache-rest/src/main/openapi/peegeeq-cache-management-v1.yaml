        streamPath: {type: string, pattern: '^/api/v1/'}
        bufferLimit: {type: integer, minimum: 1, maximum: 500}
        createdAt: {$ref: '#/components/schemas/UtcInstant'}
        expiresAt: {$ref: '#/components/schemas/UtcInstant'}
    RevealedPubSubPayload:
      type: object
      additionalProperties: false
      required: [messageId, channel, payload, contentType, encoding, receivedAt, revealedAt, autoHideAfterMillis]
      properties:
        messageId: {type: string}
        channel: {type: string}
        payload: {type: string}
        contentType: {type: [string, 'null']}
        encoding: {type: string, const: UTF8}
        receivedAt: {$ref: '#/components/schemas/UtcInstant'}
        revealedAt: {$ref: '#/components/schemas/UtcInstant'}
        autoHideAfterMillis: {type: integer, minimum: 1}
    PublishRequest:
      type: object
      additionalProperties: false
      required: [channel, payload]
      properties:
        channel: {type: string, minLength: 1, maxLength: 63}
        payload: {type: string}
    PublishAccepted:
      type: object
      additionalProperties: false
      required: [accepted, publishedAt]
      properties:
        accepted: {type: boolean, const: true}
        publishedAt: {$ref: '#/components/schemas/UtcInstant'}
    AvailableLongValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [availability, reason, value]
          properties:
            availability: {type: string, const: AVAILABLE}
            reason: {type: 'null'}
            value: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        - type: object
          additionalProperties: false
          required: [availability, reason, value]
          properties:
            availability: {type: string, const: UNAVAILABLE}
            reason: {type: string, minLength: 1, maxLength: 256}
            value: {type: 'null'}
      discriminator: {propertyName: availability}
    DatabaseMonitoring:
      type: object
      additionalProperties: false
      required: [scope, observedAt, health, tableBytes, indexBytes, schemaBytes, liveRows, expiredRows, deadTuples, lastVacuumAt, lastAutovacuumAt, databaseConnections, cacheConnections, expiryBacklog, oldestExpiredRowLagMillis]
      properties:
        scope: {type: string, const: DATABASE}
        observedAt: {$ref: '#/components/schemas/UtcInstant'}
        health: {$ref: '#/components/schemas/SetupHealth'}
        tableBytes: {$ref: '#/components/schemas/AvailableLongValue'}
        indexBytes: {$ref: '#/components/schemas/AvailableLongValue'}
        schemaBytes: {$ref: '#/components/schemas/AvailableLongValue'}
        liveRows: {$ref: '#/components/schemas/AvailableLongValue'}
        expiredRows: {$ref: '#/components/schemas/AvailableLongValue'}
        deadTuples: {$ref: '#/components/schemas/AvailableLongValue'}
        lastVacuumAt:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastAutovacuumAt:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        databaseConnections: {$ref: '#/components/schemas/AvailableLongValue'}
        cacheConnections: {$ref: '#/components/schemas/AvailableLongValue'}
        expiryBacklog: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        oldestExpiredRowLagMillis: {type: [integer, 'null'], minimum: 0}
    RuntimePoolState:
      type: object
      additionalProperties: false
      required: [active, idle, pending, maximum]
      properties:
        active: {$ref: '#/components/schemas/AvailableLongValue'}
        idle: {$ref: '#/components/schemas/AvailableLongValue'}
        pending: {$ref: '#/components/schemas/AvailableLongValue'}
        maximum: {$ref: '#/components/schemas/AvailableLongValue'}
    AuditQueueState:
      type: object
      additionalProperties: false
      required: [depth, capacity, acceptingMutations]
      properties:
        depth: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        capacity: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        acceptingMutations: {type: boolean}
    ExpirySweeperState:
      type: object
      additionalProperties: false
      required: [ownedByRuntime, running, lastSweepAt]
      properties:
        ownedByRuntime: {type: boolean}
        running: {type: boolean}
        lastSweepAt:
          oneOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
    OperationAggregate:
      type: object
      additionalProperties: false
      required: [operation, status, count, errorCount, latencyMillis]
      properties:
        operation: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, enum: [ACTIVE, COMPLETE, FAILED]}
        count: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        errorCount: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        latencyMillis: {$ref: '#/components/schemas/NonNegativeDecimalString'}
    RuntimeMonitoring:
      type: object
      additionalProperties: false
      required: [scope, observedAt, lifecycleState, pool, activeOperations, pubSubSubscriptions, sseClients, webSocketClients, retainedPayloadBytes, auditQueue, expirySweeper, operations]
      properties:
        scope: {type: string, const: MANAGEMENT_RUNTIME}
        observedAt: {$ref: '#/components/schemas/UtcInstant'}
        lifecycleState: {type: string, enum: [NEW, STARTING, RUNNING, STOPPING, STOPPED, FAILED]}
        pool: {$ref: '#/components/schemas/RuntimePoolState'}
        activeOperations: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        pubSubSubscriptions: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        sseClients: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        webSocketClients: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        retainedPayloadBytes: {$ref: '#/components/schemas/NonNegativeDecimalString'}
        auditQueue: {$ref: '#/components/schemas/AuditQueueState'}
        expirySweeper: {$ref: '#/components/schemas/ExpirySweeperState'}
        operations: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/OperationAggregate'}}
    ActivityResource:
      type: object
      additionalProperties: false
      required: [type, identifier]
      properties:
        type: {type: string, enum: [SETUP, CACHE_ENTRY, COUNTER, LOCK, SUBSCRIPTION, PUBSUB_MESSAGE]}
        identifier: {type: [string, 'null'], maxLength: 1024}
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [eventId, occurredAt, actor, action, outcome, setupId, namespace, resource, summary, correlationId]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 64}
        occurredAt: {$ref: '#/components/schemas/UtcInstant'}
        actor: {type: string, minLength: 1, maxLength: 256}
        action: {type: string, minLength: 1, maxLength: 128}
        outcome: {type: string, enum: [SUCCEEDED, REJECTED, FAILED, UNKNOWN]}
        setupId: {type: string}
        namespace: {type: [string, 'null'], maxLength: 128}
        resource: {$ref: '#/components/schemas/ActivityResource'}
        summary: {type: string, maxLength: 512}
        correlationId: {type: string, maxLength: 128}
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextAfter, hasMore]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ActivityEvent'}}
        nextAfter: {type: [string, 'null'], maxLength: 4096}
        hasMore: {type: boolean}
    StreamReady:
      type: object
      additionalProperties: false
      required: [connectedAt]
      properties:
        connectedAt: {$ref: '#/components/schemas/UtcInstant'}
    SetupStateChanged:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [CONNECTING, CONNECTED, DETACHING, DETACHED, UNHEALTHY]}
    ResourceChanged:
      type: object
      additionalProperties: false
      required: [resourceType, namespace, identifier, action, resultingVersion, actor, outcome, correlationId]
      properties:
        resourceType: {type: string, enum: [CACHE_ENTRY, COUNTER, LOCK, SUBSCRIPTION, PUBSUB_MESSAGE]}
        namespace: {type: [string, 'null']}
        identifier: {type: [string, 'null']}
        action: {type: string}
        resultingVersion:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeDecimalString'
            - type: 'null'
        actor: {type: string}
        outcome: {type: string, enum: [SUCCEEDED, REJECTED, FAILED, UNKNOWN]}
        correlationId: {type: string}
    ServerShuttingDown:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, maxLength: 256}
    PubSubSseEvent:
      type: object
      additionalProperties: false
      required: [eventId, event, data]
      properties:
        eventId:
          type: string
        event:
          type: string
          enum: [ready, pubsub.message, reset]
        data:
          oneOf:
            - $ref: '#/components/schemas/StreamReady'
            - $ref: '#/components/schemas/PubSubMessageMetadata'
            - $ref: '#/components/schemas/StreamReset'
    PubSubMessageMetadata:
      type: object
      additionalProperties: false
      required: [messageId, channel, contentType, payloadBytes, receivedAt, payloadState]
      properties:
        messageId:
          type: string
        channel:
          type: string
        contentType:
          type: [string, 'null']
        payloadBytes:
          type: integer
          minimum: 0
        receivedAt:
          type: string
          format: date-time
        payloadState:
          type: string
          const: MASKED
    MetricsSseEvent:
      type: object
      additionalProperties: false
      required: [eventId, event, data]
      properties:
        eventId:
          type: string
        event:
          type: string
          enum: [ready, overview.snapshot, runtime.snapshot, health.changed, reset]
        data:
          oneOf:
            - $ref: '#/components/schemas/StreamReady'
            - $ref: '#/components/schemas/Overview'
            - $ref: '#/components/schemas/RuntimeMonitoring'
            - $ref: '#/components/schemas/SetupHealth'
            - $ref: '#/components/schemas/StreamReset'
    MonitoringWebSocketEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, type, occurredAt, setupId, data]
      properties:
        eventId:
          type: string
        type:
          type: string
          enum: [connection.ready, setup.state.changed, health.changed, activity.created, resource.changed, stream.reset, server.shutting_down]
        occurredAt:
          type: string
          format: date-time
        setupId:
          type: string
        data:
          oneOf:
            - $ref: '#/components/schemas/StreamReady'
            - $ref: '#/components/schemas/SetupStateChanged'
            - $ref: '#/components/schemas/SetupHealth'
            - $ref: '#/components/schemas/ActivityEvent'
            - $ref: '#/components/schemas/ResourceChanged'
            - $ref: '#/components/schemas/StreamReset'
            - $ref: '#/components/schemas/ServerShuttingDown'
    StreamReset:
      type: object
      additionalProperties: false
      required: [oldestAvailableEventId]
      properties:
        oldestAvailableEventId:
          type: [string, 'null']
    ManagementProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, correlationId, fieldErrors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string, minLength: 1, maxLength: 256}
              message: {type: string, minLength: 1, maxLength: 512}
