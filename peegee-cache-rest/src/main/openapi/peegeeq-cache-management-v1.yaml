          $ref: '#/components/responses/ManagementProblem'
      operationId: revealPubSubPayload
  /api/v1/setups/{setupId}/pubsub/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SetupId'
      - $ref: '#/components/parameters/SubscriptionId'
    delete:
      x-security-profile: VIEW_MUTATE
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: deletePubSubSubscription
  /api/v1/setups/{setupId}/pubsub/publish:
    parameters:
      - $ref: '#/components/parameters/SetupId'
    post:
      x-security-profile: OPERATE
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        $ref: '#/components/requestBodies/PublishRequest'
      responses:
        '200':
          $ref: '#/components/responses/PublishAccepted'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: publishPubSubMessage
  /api/v1/setups/{setupId}/monitoring/database:
    parameters:
      - $ref: '#/components/parameters/SetupId'
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        '200':
          $ref: '#/components/responses/DatabaseMonitoring'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getDatabaseMonitoring
  /api/v1/setups/{setupId}/monitoring/runtime:
    parameters:
      - $ref: '#/components/parameters/SetupId'
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      responses:
        '200':
          $ref: '#/components/responses/RuntimeMonitoring'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: getRuntimeMonitoring
  /api/v1/setups/{setupId}/sse/metrics:
    parameters:
      - $ref: '#/components/parameters/SetupId'
    get:
      x-security-profile: SSE
      x-transport: sse
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          $ref: '#/components/responses/MetricsSse'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: streamMetrics
  /api/v1/setups/{setupId}/activity:
    parameters:
      - $ref: '#/components/parameters/SetupId'
    get:
      x-security-profile: VIEW
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/ActivityAfter'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/NamespaceFilter'
        - $ref: '#/components/parameters/ActivityAction'
        - $ref: '#/components/parameters/ActivityOutcome'
      responses:
        '200':
          $ref: '#/components/responses/ActivityPage'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: listActivity
  /ws/monitoring:
    get:
      x-security-profile: WS
      x-transport: websocket
      x-websocket-message-schema:
        $ref: '#/components/schemas/MonitoringWebSocketEnvelope'
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/MonitoringSetupId'
        - $ref: '#/components/parameters/AfterEventId'
      responses:
        '101':
          $ref: '#/components/responses/MonitoringWebSocket'
        default:
          $ref: '#/components/responses/ManagementProblem'
      operationId: monitoringWebSocket
components:
  securitySchemes:
    managementSession:
      type: apiKey
      in: cookie
      name: PGQMGMTSESSION
    trustedProxyIdentity:
      type: apiKey
      in: header
      name: X-PeeGeeQ-User
  parameters:
    SetupId:
      name: setupId
      in: path
      required: true
      description: Stable server-side setup identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    EncodedNamespace:
      name: encodedNamespace
      in: path
      required: true
      description: Canonical unpadded Base64 URL encoding of a non-empty UTF-8 namespace.
      schema:
        type: string
        minLength: 1
        maxLength: 171
        pattern: '^[A-Za-z0-9_-]+$'
    EncodedKey:
      name: encodedKey
      in: path
      required: true
      description: Canonical unpadded Base64 URL encoding of a non-empty UTF-8 key.
      schema:
        type: string
        minLength: 1
        maxLength: 1366
        pattern: '^[A-Za-z0-9_-]+$'
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Origin:
      name: Origin
      in: header
      required: true
      description: Browser origin validated against the configured exact-origin policy.
      schema: {type: string, format: uri, maxLength: 2048}
    Csrf:
      name: X-PeeGeeQ-CSRF
      in: header
      required: true
      description: Session-scoped CSRF token for state-changing requests.
      schema: {type: string, minLength: 32, maxLength: 512}
    ExactIfMatch:
      name: If-Match
      in: header
      required: true
      description: Required strong decimal version tag.
      schema: {type: string, pattern: '^"v[0-9]+"$'}
    ConditionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Exact strong version tag or wildcard as permitted by the selected mode.
      schema: {type: string, pattern: '^(\*|"v[0-9]+")$'}
    ConditionalIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Wildcard creation precondition.
      schema: {type: string, const: '*'}
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    NamespaceExportAccept:
      name: Accept
      in: header
      required: false
      schema: {type: string, enum: [application/json, text/csv]}
    Prefix:
      name: prefix
      in: query
      required: false
      schema: {type: string, maxLength: 1024}
    NamespacePrefix:
      name: prefix
      in: query
      required: false
      schema: {type: string, maxLength: 128}
    NamespaceStatus:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [ALL, HEALTHY, EXPIRED_BACKLOG, ACTIVE_LOCKS], default: ALL}
    NamespaceSort:
      name: sort
      in: query
      required: false
      schema: {type: string, enum: ['namespace:asc', 'entryCount:desc'], default: 'namespace:asc'}
    EntrySort:
      name: sort
      in: query
      required: false
      schema: {type: string, const: 'key:asc'}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 4096}
    PageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    EntryValueType:
      name: valueType
      in: query
      required: false
      schema: {type: string, enum: [STRING, JSON, LONG, BYTES]}
    EntryTtlState:
      name: ttlState
      in: query
      required: false
      schema: {type: string, enum: [ALL_LIVE, PERSISTENT, EXPIRING, INCLUDE_EXPIRED], default: ALL_LIVE}
    IncludeExpired:
      name: includeExpired
      in: query
      required: false
      schema: {type: boolean, default: false}
    NamespaceFilter:
      name: namespace
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    LeaseState:
      name: leaseState
      in: query
      required: false
      schema: {type: string, enum: [ACTIVE, EXPIRING_SOON], default: ACTIVE}
    ActivityAfter:
      name: after
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    ActivityAction:
      name: action
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
    ActivityOutcome:
      name: outcome
      in: query
      required: false
      schema: {type: string, enum: [SUCCEEDED, REJECTED, FAILED, UNKNOWN]}
    MonitoringSetupId:
      name: setupId
      in: query
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 128}
  requestBodies:
    LocalTokenExchangeRequest:
      description: Single-use local bootstrap token exchange.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalTokenExchangeRequest'
    SetupConnectionRequest:
      description: Unregistered PostgreSQL connection to test.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupConnectionRequest'
    SetupRegistrationRequest:
      description: Setup registration and secret references.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupRegistrationRequest'
    OptionalRevealReasonRequest:
      description: Optional bounded reason for revealing sensitive data.
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevealReasonRequest'
    ManagementCacheSetBody:
      description: Cache value and atomic TTL mode.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementCacheSetBody'
    EntryTtlRequest:
      description: Positive cache-entry TTL.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryTtlRequest'
    EntryTouchRequest:
      description: Optional positive TTL to refresh while preserving the entry version.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryTouchRequest'
    EntryDeleteSelection:
      description: Explicit or filter-based entry deletion selection.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntryDeleteSelection'
    ConfirmedEntryDelete:
      description: Single-use entry deletion preview confirmation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmedEntryDelete'
    ManagementCounterSetBody:
      description: Counter value and atomic TTL mode.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementCounterSetBody'
    ManagementCounterAdjustBody:
      description: Non-zero counter delta and atomic creation/TTL rules.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementCounterAdjustBody'
    CounterTtlRequest:
      description: Positive counter TTL.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CounterTtlRequest'
    CounterDeleteSelection:
      description: Explicit counter deletion targets.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CounterDeleteSelection'
    ConfirmedCounterDelete:
      description: Single-use counter deletion preview confirmation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfirmedCounterDelete'
    ForceReleaseLockBody:
      description: Exact decoded lock-key confirmation and optional reason.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForceReleaseLockBody'
    CreateSubscriptionRequest:
      description: Bounded process-local PostgreSQL channel subscription.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSubscriptionRequest'
    PublishRequest:
      description: PostgreSQL channel and bounded UTF-8 payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishRequest'
  headers:
    XCorrelationID:
      description: Request correlation identifier echoed by the server.
      required: true
      schema:
        type: string
        format: uuid
    CacheControl:
      description: Endpoint-specific cache prevention directive.
      required: true
      schema:
        type: string
    Pragma:
      description: Legacy cache prevention directive for sensitive reveals.
      required: true
      schema:
        type: string
        const: no-cache
    ETag:
      description: Strong decimal resource version tag.
      required: true
      schema:
        type: string
        pattern: '^"v[0-9]+"$'
    Connection:
      description: SSE connection persistence directive for HTTP/1.1 clients.
      required: true
      schema:
        type: string
        const: keep-alive
    SetCookie:
      description: Rotated, created, or expired management-session cookie.
      required: false
      schema:
        type: string
  responses:
    ManagementProblem:
      description: Safe management API problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ManagementProblem'
    CurrentSessionNoStore:
      description: Current authenticated management session.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Set-Cookie:
          $ref: '#/components/headers/SetCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentSession'
    NoContent:
      description: Operation completed without a response body.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
    LocalSessionDeleted:
      description: Local session deleted and its cookie expired.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Set-Cookie:
          $ref: '#/components/headers/SetCookie'
    SetupSummaryList:
      description: Registered setup summaries.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupSummaryList'
    SetupConnectionTest:
      description: Setup connection test result.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupConnectionTest'
    SetupSummaryCreated:
      description: Registered setup summary.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupSummary'
    SetupSummary:
      description: Setup summary.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupSummary'
    SetupDetails:
      description: Setup details.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupDetails'
    SetupHealth:
      description: Setup health snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupHealth'
    SetupCapabilities:
      description: Effective setup capabilities and limits.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetupCapabilities'
    Overview:
      description: Setup overview snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Overview'
    AdminPageNamespaceStats:
      description: Page of namespace statistics.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPageNamespaceStats'
    NamespaceExport:
      description: Bounded namespace metadata export.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NamespaceExport'
        text/csv:
          schema:
            type: string
    NamespaceDetails:
      description: Namespace details.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NamespaceDetails'
    AdminPageManagementEntryMetadata:
      description: Page of cache-entry metadata.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPageManagementEntryMetadata'
    ManagementEntryMetadataEntity:
      description: Versioned cache-entry metadata.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementEntryMetadata'
    RevealedEntryValue:
      description: Sensitive cache-entry value snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Pragma:
          $ref: '#/components/headers/Pragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevealedEntryValue'
    ManagementSetResultEntity:
      description: Applied cache-entry set result.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementSetResult'
    BulkDeletePreview:
      description: Bounded bulk-delete preview.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeletePreview'
    BulkDeleteResult:
      description: Bulk-delete execution result.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteResult'
    AdminPageCounterEntry:
      description: Page of counters.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPageCounterEntry'
    CounterEntryEntity:
      description: Versioned counter.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CounterEntry'
    AdminPageLockState:
      description: Page of active locks.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminPageLockState'
    LockStateEntity:
      description: Versioned active lock.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LockState'
    RevealedLockOwner:
      description: Sensitive lock-owner snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Pragma:
          $ref: '#/components/headers/Pragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevealedLockOwner'
    SubscriptionSummaryCreated:
      description: Process-local pub/sub subscription.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionSummary'
    PubSubSse:
      description: Pub/sub server-sent event stream.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/Connection'
      content:
        text/event-stream:
          schema:
            $ref: '#/components/schemas/PubSubSseEvent'
    RevealedPubSubPayload:
      description: Sensitive retained pub/sub payload.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Pragma:
          $ref: '#/components/headers/Pragma'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevealedPubSubPayload'
    PublishAccepted:
      description: Accepted PostgreSQL pub/sub publication.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishAccepted'
    DatabaseMonitoring:
      description: PostgreSQL monitoring snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DatabaseMonitoring'
    RuntimeMonitoring:
      description: Management-process runtime snapshot.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeMonitoring'
    MetricsSse:
      description: Metrics server-sent event stream.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Connection:
          $ref: '#/components/headers/Connection'
      content:
        text/event-stream:
          schema:
            $ref: '#/components/schemas/MetricsSseEvent'
    ActivityPage:
      description: Bounded process-local activity page.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityPage'
    MonitoringWebSocket:
      description: Switching protocols; subsequent frames follow the declared WebSocket envelope.
  schemas:
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Signed 64-bit integer represented as a decimal string.
    NonNegativeDecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Non-negative 64-bit value represented as a decimal string.
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
    NamespaceQuery:
      type: object
      additionalProperties: false
      properties:
        prefix: {type: string, maxLength: 128}
        status: {type: string, enum: [ALL, HEALTHY, EXPIRED_BACKLOG, ACTIVE_LOCKS], default: ALL}
        sort: {type: string, enum: ['namespace:asc', 'entryCount:desc'], default: 'namespace:asc'}
        cursor: {type: string, minLength: 1, maxLength: 4096}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
    NamespaceExportQuery:
      type: object
      additionalProperties: false
      properties:
        prefix: {type: string, maxLength: 128}
        status: {type: string, enum: [ALL, HEALTHY, EXPIRED_BACKLOG, ACTIVE_LOCKS], default: ALL}
        sort: {type: string, enum: ['namespace:asc', 'entryCount:desc'], default: 'namespace:asc'}
    EntryQuery:
      type: object
      additionalProperties: false
      properties:
        prefix: {type: string, maxLength: 1024}
        valueType: {type: string, enum: [STRING, JSON, LONG, BYTES]}
        ttlState: {type: string, enum: [ALL_LIVE, PERSISTENT, EXPIRING, INCLUDE_EXPIRED], default: ALL_LIVE}
        cursor: {type: string, minLength: 1, maxLength: 4096}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
        sort: {type: string, const: 'key:asc'}
    CounterQuery:
      type: object
      additionalProperties: false
      properties:
        namespace: {type: string, minLength: 1, maxLength: 128}
        prefix: {type: string, maxLength: 1024}
        ttlState: {type: string, enum: [ALL_LIVE, PERSISTENT, EXPIRING, INCLUDE_EXPIRED], default: ALL_LIVE}
        cursor: {type: string, minLength: 1, maxLength: 4096}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
        sort: {type: string, const: 'key:asc'}
