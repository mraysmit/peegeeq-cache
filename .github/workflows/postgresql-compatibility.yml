name: PostgreSQL compatibility

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PostgreSQL ${{ matrix.postgres_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_version: "15.17"
            postgres_image: postgres:15.17-alpine
          - postgres_version: "16.13"
            postgres_image: postgres:16.13-alpine
          - postgres_version: "17.11"
            postgres_image: postgres:17.11-alpine
          - postgres_version: "18.3"
            postgres_image: postgres:18.3-alpine

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show build environment
        run: |
          java -version
          mvn --version
          docker version

      - name: Verify full reactor
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          -Dpeegeeq.test.postgres.image=${{ matrix.postgres_image }}
