.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

.form-check:not(.form-switch)

  height: 100%;

  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input {

  height: 20px;

  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

  height: 28px;

  padding: 0;

  height: 28px;
  background: transparent;

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

    (() =&gt; {
      const root = document.getElementById(&#x27;pgc-mockup&#x27;);

        overview: &#x27;Overview&#x27;, setups: &#x27;Cache Setups&#x27;, namespaces: &#x27;Namespaces&#x27;, keys: &#x27;Key Browser&#x27;,

        root.querySelectorAll(&#x27;.pgc-page&#x27;).forEach(page =&gt; page.classList.toggle(&#x27;is-active&#x27;, page.dataset.screen === name));
        root.querySelectorAll(&#x27;.pgc-nav-button&#x27;).forEach(button =&gt; {
          if (button.dataset.page === name || (name === &#x27;key-detail&#x27; &amp;&amp; button.dataset.page === &#x27;keys&#x27;)) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
          else button.removeAttribute(&#x27;aria-current&#x27;);
        });
        title.textContent = labels[name] || &#x27;PeeGeeQ Cache&#x27;;
      };
      root.querySelectorAll(&#x27;[data-page], [data-page-jump]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; showPage(button.dataset.page || button.dataset.pageJump));
      });
      root.querySelectorAll(&#x27;[data-open-modal]&#x27;).forEach(button =&gt; {

      });
      root.querySelectorAll(&#x27;[data-close-modal]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; button.closest(&#x27;.pgc-modal-backdrop&#x27;).classList.remove(&#x27;is-open&#x27;));
      });
      root.querySelectorAll(&#x27;.pgc-modal-backdrop&#x27;).forEach(backdrop =&gt; {
        backdrop.addEventListener(&#x27;click&#x27;, event =&gt; { if (event.target === backdrop) backdrop.classList.remove(&#x27;is-open&#x27;); });
      });
      const reveal = root.querySelector(&#x27;#pgc-reveal-value&#x27;);
      const mask = root.querySelector(&#x27;#pgc-value-mask&#x27;);
      const json = root.querySelector(&#x27;#pgc-value-json&#x27;);
      const valueStatus = root.querySelector(&#x27;#pgc-value-status&#x27;);
      reveal.addEventListener(&#x27;click&#x27;, () =&gt; {
        const isHidden = json.classList.contains(&#x27;pgc-hidden&#x27;);
        json.classList.toggle(&#x27;pgc-hidden&#x27;, !isHidden);
        mask.classList.toggle(&#x27;pgc-hidden&#x27;, isHidden);
        valueStatus.textContent = isHidden ? &#x27;Revealed · audited&#x27; : &#x27;Masked&#x27;;
        valueStatus.className = `pgc-tag ${isHidden ? &#x27;pgc-tag-red&#x27; : &#x27;pgc-tag-amber&#x27;}`;
        reveal.innerHTML = isHidden ? &#x27;&lt;i data-lucide=&quot;eye-off&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Hide value&#x27; : &#x27;&lt;i data-lucide=&quot;eye&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Reveal value&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });
      const keySearch = root.querySelector(&#x27;#pgc-key-search&#x27;);
      keySearch.addEventListener(&#x27;input&#x27;, () =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

        }
      });

    if (!trigger.isConnected || content.length === 0) {

    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    floating.style.visibility = &quot;hidden&quot;;
